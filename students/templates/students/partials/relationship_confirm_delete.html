<div class="rounded-3xl border border-red-200 bg-white p-6 shadow-xl shadow-red-100/70">
  <p class="text-xs font-semibold uppercase tracking-[0.2em] text-red-700">Confirm removal</p>
  <h2 class="mt-2 text-2xl font-black text-slate-950">Remove guardian link</h2>
  <p class="mt-4 text-sm leading-7 text-slate-600">This will remove the relationship between {{ object.student }} and {{ object.guardian }}.</p>

  <form method="post" class="mt-6 flex flex-wrap gap-3" data-confirm="Remove this guardian link?" {% if request.htmx %}hx-post="{{ request.path }}" hx-target="#student-side-panel" hx-swap="innerHTML"{% endif %}>
    {% csrf_token %}
    <button type="submit" class="rounded-full bg-red-700 px-4 py-2 text-sm font-semibold text-white hover:bg-red-800">Remove link</button>
    <a href="{% url 'students:student-detail' object.student.pk %}" hx-boost="false" class="rounded-full border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Cancel</a>
  </form>
</div>
