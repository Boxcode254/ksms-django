{% extends "base.html" %}

{% block title %}KSMS | Deleted Students{% endblock %}

{% block content %}
<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
    <div class="space-y-1">
      <nav class="ksms-breadcrumbs" aria-label="Breadcrumb">
        <a href="{% url 'core:dashboard' %}" hx-boost="false">Dashboard</a>
        <span class="sep" aria-hidden="true">/</span>
        <a href="{% url 'students:student-list' %}">Students</a>
        <span class="sep" aria-hidden="true">/</span>
        <span class="current" aria-current="page">Deleted</span>
      </nav>
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">Deleted Students</h1>
      <p class="text-xs text-slate-500 mt-0.5">Review and restore soft-deleted student records.</p>
    </div>
    <a href="{% url 'students:student-list' %}" class="ksms-btn ksms-btn-secondary">Back to students</a>
  </div>

  <div id="deleted-student-results" class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
    {% include "students/partials/deleted_student_results.html" %}
  </div>
</div>
{% endblock %}
