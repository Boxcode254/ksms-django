<div class="w-full max-w-4xl rounded-3xl bg-white p-6 shadow-2xl shadow-slate-900/10 sm:p-8">
  <div class="mb-6 flex items-start justify-between gap-4 border-b border-slate-200 pb-4">
    <div>
      <p class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">Academics · Grades</p>
      <h2 id="ksms-modal-title" class="mt-2 text-2xl font-black text-slate-950">{{ form_title }}</h2>
    </div>
    <button type="button" data-modal-close class="rounded-full border border-slate-200 px-3 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-50">Close</button>
  </div>

  <form method="post" enctype="multipart/form-data" class="space-y-6" novalidate {% if request.htmx %}hx-post="{{ request.path }}" hx-target="#ksms-modal-body" hx-swap="innerHTML"{% endif %}>
    {% csrf_token %}
    {% include "academics/partials/academic_form_fields.html" %}
  </form>
</div>
