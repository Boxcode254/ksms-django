<div class="mx-auto w-full max-w-xl border border-slate-200 bg-white p-4 sm:p-5">
  <div class="mb-4 flex items-start justify-between gap-4 pb-1">
    <div>
      <h2 id="ksms-modal-title" class="text-2xl font-bold text-slate-950">{{ form_title }}</h2>
    </div>
    <button type="button" data-modal-close class="border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50">Close</button>
  </div>

  <form method="post" class="ksms-form-compact space-y-4" novalidate {% if request.htmx %}hx-post="{{ request.path }}" hx-target="#ksms-modal-body" hx-swap="innerHTML"{% endif %}>
    {% csrf_token %}
    {% include "academics/partials/academic_form_fields.html" %}
  </form>
</div>
