<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; color: #333; line-height: 1.6; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { background-color: #0f172a; color: #fff; padding: 20px; text-align: center; }
    .content { padding: 20px; background-color: #f8fafc; }
    .button { display: inline-block; padding: 12px 24px; background-color: #1a4989; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; margin: 16px 0; }
    .footer { text-align: center; padding: 20px; color: #64748b; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Account Notification</h2>
    </div>
    <div class="content">
      <p>Dear {{ user.get_full_name|default:user.username }},</p>
      <p>{{ message }}</p>
      {% if action_url %}
      <p style="text-align: center;">
        <a href="{{ action_url }}" class="button">Take Action</a>
      </p>
      {% endif %}
      <p>If you have any questions, please contact your school administrator.</p>
    </div>
    <div class="footer">
      <p>{{ site_name }} via KSMS</p>
    </div>
  </div>
</body>
</html>
