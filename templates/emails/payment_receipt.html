<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; color: #333; line-height: 1.6; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { background-color: #0f172a; color: #fff; padding: 20px; text-align: center; }
    .content { padding: 20px; background-color: #f8fafc; }
    .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e2e8f0; }
    .detail-label { font-weight: bold; }
    .footer { text-align: center; padding: 20px; color: #64748b; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Payment Receipt</h2>
    </div>
    <div class="content">
      <p>Dear Parent/Guardian,</p>
      <p>Payment has been received for <strong>{{ student_name }}</strong>.</p>
      <div class="detail-row">
        <span class="detail-label">Amount Paid:</span>
        <span>KES {{ amount }}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Receipt Reference:</span>
        <span>{{ receipt_ref }}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Date:</span>
        <span>{{ paid_at }}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Remaining Balance:</span>
        <span>KES {{ balance }}</span>
      </div>
      <p style="margin-top: 20px;">Please keep this reference for your records.</p>
    </div>
    <div class="footer">
      <p>{{ school_name }} via KSMS</p>
    </div>
  </div>
</body>
</html>
