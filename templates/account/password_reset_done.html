{% extends "account/base.html" %}
{% block title %}KSMS | Reset email sent{% endblock %}
{% block account_content %}
<div class="space-y-5 text-center">
  <p class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">Recovery</p>
  <h1 class="ksms-display text-3xl font-black text-slate-950">Check your email</h1>
  <p class="text-sm leading-7 text-slate-600">
    If the address exists in KSMS, we have sent a password reset link.
  </p>
  <a href="{% url 'account_login' %}" class="inline-flex rounded-full bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700">Return to login</a>
</div>
{% endblock %}
