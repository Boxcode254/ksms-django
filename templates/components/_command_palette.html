{% comment %}
Global command palette (⌘K / Ctrl+K).
Pure client-side navigation jump list. No backend search needed.
Items are visibility-filtered by role on the server before render.
{% endcomment %}
<div id="ksms-palette" class="ksms-palette" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="ksms-palette-label">
  <div class="ksms-palette-backdrop" data-palette-close></div>
  <div class="ksms-palette-panel">
    <label id="ksms-palette-label" class="sr-only">Search and navigate</label>
    <div class="ksms-palette-search">
      <svg class="h-4 w-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="M21 21l-4.3-4.3"/></svg>
      <input id="ksms-palette-input" type="text" placeholder="Search pages, jump to anything…" autocomplete="off" spellcheck="false">
      <kbd class="ksms-kbd">ESC</kbd>
    </div>
    <div id="ksms-palette-list" class="ksms-palette-list" role="listbox"></div>
    <div class="ksms-palette-footer">
      <span><kbd class="ksms-kbd">↑</kbd> <kbd class="ksms-kbd">↓</kbd> to navigate · <kbd class="ksms-kbd">↵</kbd> to open</span>
      <span>KSMS Quick Jump</span>
    </div>
  </div>
</div>
