{% extends "base.html" %}
{% block title %}KSMS | Delete announcement{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg space-y-6">

  <h1 class="text-xl font-black text-slate-950">Delete announcement</h1>

  <div class="rounded-3xl border border-red-200 bg-white p-8 shadow-sm space-y-4">
    <p class="text-sm text-slate-700">
      Are you sure you want to permanently delete this announcement?
    </p>
    <blockquote class="rounded-2xl bg-slate-50 border border-slate-200 px-5 py-4 text-sm font-semibold text-slate-900">
      {{ announcement.title }}
    </blockquote>
    <p class="text-xs text-red-500">This action cannot be undone.</p>

    <form method="post" class="flex flex-wrap gap-3 pt-2" data-confirm="Delete this announcement permanently?">
      {% csrf_token %}
      <button type="submit"
              class="rounded-full bg-red-600 px-6 py-2.5 text-sm font-semibold text-white hover:bg-red-700">
        Yes, delete
      </button>
      <a href="{% url 'communication:announcement-detail' announcement.pk %}"
         class="rounded-full border border-slate-200 bg-white px-6 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">
        Cancel
      </a>
    </form>
  </div>

</div>
{% endblock %}
